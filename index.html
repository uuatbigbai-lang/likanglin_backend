<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>后台管理</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #eef2f6;
      color: #172033;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .layout {
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
      min-height: 100vh;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 24px 18px;
      background: linear-gradient(180deg, #132238 0%, #1b3558 100%);
      color: #f8fbff;
    }
    .brand h1 {
      margin: 0;
      font-size: 24px;
      line-height: 32px;
    }
    .brand p {
      margin: 8px 0 0;
      color: rgba(248, 251, 255, 0.72);
      font-size: 13px;
      line-height: 20px;
    }
    .account-card {
      padding: 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
    }
    .account-card strong {
      display: block;
      margin-bottom: 4px;
      font-size: 15px;
      line-height: 22px;
    }
    .account-card .small {
      color: rgba(248, 251, 255, 0.72);
      font-size: 12px;
      line-height: 18px;
    }
    .nav {
      display: grid;
      gap: 8px;
    }
    .nav button {
      width: 100%;
      min-height: 46px;
      border: 0;
      border-radius: 10px;
      padding: 0 14px;
      background: transparent;
      color: rgba(248, 251, 255, 0.86);
      font-size: 14px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }
    .nav button.active {
      background: #f8fbff;
      color: #15304e;
      box-shadow: 0 10px 28px rgba(6, 22, 42, 0.24);
    }
    .nav button:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .nav button.active:hover {
      background: #f8fbff;
    }
    .sidebar-actions {
      margin-top: auto;
      display: grid;
      gap: 10px;
    }
    .sidebar-actions button {
      min-height: 42px;
      border: 0;
      border-radius: 10px;
      padding: 0 14px;
      background: rgba(255, 255, 255, 0.12);
      color: #f8fbff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .content {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .content-head {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding: 18px 24px;
      border-bottom: 1px solid #dbe3ee;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(10px);
    }
    .content-head h2 {
      margin: 0;
      font-size: 22px;
      line-height: 30px;
    }
    .content-head p {
      margin: 4px 0 0;
      color: #667085;
      font-size: 13px;
      line-height: 20px;
    }
    .content-frame {
      flex: 1;
      width: 100%;
      border: 0;
      background: #eef2f6;
      min-height: calc(100vh - 78px);
    }
    @media (max-width: 920px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .sidebar {
        gap: 14px;
      }
      .content-frame {
        min-height: 76vh;
      }
    }
  </style>
</head>
<body>
  <main class="layout">
    <aside class="sidebar">
      <div class="brand">
        <h1>后台管理</h1>
        <p>左侧切换模块，右侧查看当前页面。</p>
      </div>

      <div class="account-card">
        <strong id="accountName">正在校验登录状态...</strong>
        <div id="accountRole" class="small">请稍候</div>
      </div>

      <nav class="nav">
        <button type="button" data-page="orders" class="active">订单管理</button>
        <button type="button" data-page="products">商品管理</button>
        <button type="button" data-page="sales">销售管理</button>
        <button type="button" data-page="customers">客户管理</button>
        <button type="button" data-page="coupons">优惠券管理</button>
        <button type="button" data-page="bindings">绑定管理</button>
      </nav>

      <div class="sidebar-actions">
        <button id="refreshCurrentPage" type="button">刷新当前页</button>
        <button id="adminLogout" type="button">退出登录</button>
      </div>
    </aside>

    <section class="content">
      <header class="content-head">
        <div>
          <h2 id="pageTitle">订单管理</h2>
          <p id="pageDesc">查看订单、最新登录用户、优惠券管理员和优惠券流水。</p>
        </div>
      </header>
      <iframe id="contentFrame" class="content-frame" title="后台页面" src="/admin/orders"></iframe>
    </section>
  </main>

  <script>
    const AUTH_STORAGE_KEY = 'admin-auth-v1';
    const PAGE_CONFIG = {
      orders: {
        title: '订单管理',
        desc: '查看订单、发货、退货和退款处理。',
        src: '/admin/orders',
      },
      products: {
        title: '商品管理',
        desc: '维护商品员工价，供员工特别优惠券结算使用。',
        src: '/admin/products',
      },
      sales: {
        title: '销售管理',
        desc: '查看销售名字、卖货数量、销售额和注册时间。',
        src: '/admin/sales',
      },
      customers: {
        title: '客户管理',
        desc: '维护客户备注、渠道归属及销售、优惠券管理员身份。',
        src: '/admin/customers',
      },
      coupons: {
        title: '优惠券管理',
        desc: '查看优惠券流水和优惠券相关记录。',
        src: '/admin/coupons',
      },
      bindings: {
        title: '绑定管理',
        desc: '管理优惠券管理员，并把最新登录用户绑定为优惠券管理员或销售。',
        src: '/admin/bindings',
      },
    };

    const state = {
      authToken: '',
      adminProfile: null,
      page: 'orders',
    };

    const $ = (id) => document.getElementById(id);

    function headers() {
      const result = { 'Content-Type': 'application/json' };
      if (state.authToken) result['x-admin-token'] = state.authToken;
      return result;
    }

    function clearAuth() {
      state.authToken = '';
      state.adminProfile = null;
      localStorage.removeItem(AUTH_STORAGE_KEY);
    }

    function redirectToLogin() {
      window.location.replace('/admin');
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, options);
      const json = await response.json().catch(() => ({}));
      if (response.status === 401) {
        clearAuth();
        redirectToLogin();
      }
      if (!response.ok || json.code !== 0) {
        throw new Error(json.message || `请求失败：${response.status}`);
      }
      return json;
    }

    function readPageFromLocation() {
      const search = new URLSearchParams(window.location.search);
      const page = search.get('page');
      return PAGE_CONFIG[page] ? page : 'orders';
    }

    function syncPageMeta() {
      const page = PAGE_CONFIG[state.page] || PAGE_CONFIG.orders;
      $('pageTitle').textContent = page.title;
      $('pageDesc').textContent = page.desc;
      document.querySelectorAll('[data-page]').forEach((button) => {
        button.classList.toggle('active', button.dataset.page === state.page);
      });
    }

    function switchPage(page, shouldPush = true) {
      if (!PAGE_CONFIG[page]) page = 'orders';
      state.page = page;
      syncPageMeta();
      $('contentFrame').src = PAGE_CONFIG[page].src;
      if (shouldPush) {
        const url = new URL(window.location.href);
        url.searchParams.set('page', page);
        window.history.replaceState({ page }, '', url.toString());
      }
    }

    function updateAccountUI() {
      if (state.adminProfile) {
        $('accountName').textContent = state.adminProfile.displayName || state.adminProfile.username || '后台账号';
        $('accountRole').textContent = `角色：${state.adminProfile.roleType || 'sales'}`;
      } else {
        $('accountName').textContent = '未登录';
        $('accountRole').textContent = '请先登录后台';
      }
    }

    async function restoreAdminAuth() {
      const raw = localStorage.getItem(AUTH_STORAGE_KEY);
      if (!raw) {
        updateAccountUI();
        redirectToLogin();
        return;
      }
      try {
        const stored = JSON.parse(raw);
        state.authToken = String(stored?.token || '');
        state.adminProfile = stored?.account || null;
        updateAccountUI();
        const json = await requestJson('/api/admin/me', { headers: headers() });
        state.adminProfile = json.data || state.adminProfile;
        updateAccountUI();
        switchPage(readPageFromLocation(), false);
      } catch (err) {
        clearAuth();
        redirectToLogin();
      }
    }

    document.querySelectorAll('[data-page]').forEach((button) => {
      button.addEventListener('click', () => switchPage(button.dataset.page));
    });

    $('refreshCurrentPage').addEventListener('click', () => {
      const frame = $('contentFrame');
      frame.src = PAGE_CONFIG[state.page].src;
    });

    $('adminLogout').addEventListener('click', () => {
      clearAuth();
      redirectToLogin();
    });

    window.addEventListener('message', (event) => {
      const data = event.data || {};
      if (data.type === 'admin:navigate' && PAGE_CONFIG[data.page]) {
        switchPage(data.page);
      }
    });

    window.addEventListener('popstate', () => {
      switchPage(readPageFromLocation(), false);
    });

    restoreAdminAuth();
  </script>
</body>
</html>
