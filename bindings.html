<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>绑定管理</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f4f6f8;
      color: #172033;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .shell {
      max-width: 1360px;
      margin: 0 auto;
      padding: 24px 20px 56px;
    }
    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(240px, 320px);
      gap: 20px;
      align-items: end;
      margin-bottom: 18px;
    }
    .auth-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
    .auth-status {
      padding: 10px 12px;
      border: 1px solid #dbe6f3;
      border-radius: 6px;
      background: #f8fbff;
      color: #1f5f9f;
      font-size: 13px;
      line-height: 20px;
    }
    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 34px;
    }
    .muted {
      margin: 6px 0 0;
      color: #667085;
      font-size: 14px;
      line-height: 22px;
    }
    .panel {
      background: #fff;
      border: 1px solid #e4e7ec;
      border-radius: 8px;
      box-shadow: 0 8px 22px rgba(20, 35, 60, 0.05);
      overflow: hidden;
    }
    .admin-card {
      padding: 16px;
    }
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .card-head h2 {
      margin: 0;
      font-size: 18px;
    }
    .card-head button {
      min-height: 32px;
      padding: 0 10px;
      font-size: 13px;
    }
    .mini-list {
      display: grid;
      gap: 8px;
      max-height: 360px;
      overflow: auto;
    }
    .mini-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 0;
      border-bottom: 1px solid #eef2f6;
      font-size: 13px;
      line-height: 20px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      color: #344054;
      font-size: 13px;
      line-height: 20px;
      font-weight: 700;
    }
    input {
      width: 100%;
      min-height: 40px;
      border: 1px solid #d0d5dd;
      border-radius: 6px;
      padding: 8px 10px;
      background: #fff;
      color: #172033;
      font-size: 14px;
      outline: none;
    }
    input:focus {
      border-color: #2472c8;
      box-shadow: 0 0 0 3px rgba(36, 114, 200, 0.12);
    }
    button {
      min-height: 40px;
      border: 0;
      border-radius: 6px;
      padding: 0 14px;
      background: #2472c8;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    button.secondary {
      background: #edf4ff;
      color: #1f5f9f;
    }
    button.subtle {
      background: #f2f4f7;
      color: #344054;
    }
    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }
    .notice {
      display: none;
      margin-bottom: 16px;
      padding: 10px 12px;
      border-radius: 6px;
      background: #ecfdf3;
      color: #027a48;
      font-size: 14px;
      line-height: 22px;
      white-space: pre-wrap;
    }
    .notice.error {
      background: #fef3f2;
      color: #b42318;
    }
    .notice.show { display: block; }
    .small {
      color: #667085;
      font-size: 12px;
      line-height: 18px;
    }
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }
    .modal.show {
      display: flex;
    }
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(16, 24, 40, 0.56);
    }
    .modal-card {
      position: relative;
      width: min(100%, 440px);
      padding: 22px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 24px 60px rgba(16, 24, 40, 0.24);
    }
    .modal-card h3 {
      margin: 0 0 8px;
      font-size: 20px;
      line-height: 28px;
    }
    .modal-desc {
      margin: 0 0 18px;
      color: #667085;
      font-size: 14px;
      line-height: 22px;
    }
    .modal-grid {
      display: grid;
      gap: 14px;
    }
    .modal-summary {
      padding: 12px 14px;
      border: 1px solid #e4e7ec;
      border-radius: 8px;
      background: #f8fafc;
    }
    .modal-summary strong {
      display: block;
      margin-bottom: 4px;
      font-size: 15px;
      line-height: 22px;
      word-break: break-all;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }
    .role-options {
      display: grid;
      gap: 10px;
    }
    .role-radio {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 12px 14px;
      border: 1px solid #dbe6f3;
      border-radius: 8px;
      cursor: pointer;
    }
    .role-radio input {
      width: auto;
      min-height: auto;
      margin-top: 3px;
    }
    .role-radio strong {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
    }
    .field-hidden {
      display: none;
    }
    @media (max-width: 920px) {
      .topbar {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>绑定管理</h1>
        <p class="muted">把最新登录用户绑定为优惠券管理员或销售。</p>
      </div>
      <div class="panel admin-card">
        <div id="authStatus" class="auth-status">正在校验登录状态...</div>
        <div class="auth-actions" style="margin-top:10px">
          <button id="adminLogout" class="subtle" type="button">退出登录</button>
        </div>
      </div>
    </header>

    <div id="notice" class="notice"></div>

    <section class="panel admin-card">
      <div class="card-head">
        <div>
          <h2>最新登录用户</h2>
          <div class="small" style="margin-top:4px">从最近登录的 5 个用户里选择角色并完成绑定。</div>
        </div>
        <div class="auth-actions">
          <button id="openCouponsPage" class="subtle" type="button">去优惠券管理</button>
          <button id="refreshLatestUsers" type="button">刷新</button>
        </div>
      </div>
      <div id="latestUsers" class="mini-list"></div>
    </section>
  </main>

  <div id="roleAssignModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-action="close-role-assign-modal"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="roleAssignModalTitle">
      <h3 id="roleAssignModalTitle">选择添加角色</h3>
      <p class="modal-desc">从“最新登录用户”里选中的账号，会按这里选择的角色写入对应数据表。</p>
      <div class="modal-grid">
        <div class="modal-summary">
          <strong id="roleAssignUserName">-</strong>
          <div class="small">openid：<span id="roleAssignUserOpenid">-</span></div>
        </div>
        <div>
          <label>角色</label>
          <div class="role-options">
            <label class="role-radio">
              <input type="radio" name="assignRoleType" value="coupon-admin" checked>
              <div>
                <strong>优惠券管理员</strong>
                <div class="small">保持原来的白名单逻辑，直接加入优惠券管理员。</div>
              </div>
            </label>
            <label class="role-radio">
              <input type="radio" name="assignRoleType" value="sales">
              <div>
                <strong>销售</strong>
                <div class="small">加入销售表，后续这个账号的订单会统计到销售管理里。</div>
              </div>
            </label>
          </div>
        </div>
        <div>
          <label for="roleAssignRemark">备注</label>
          <input id="roleAssignRemark" placeholder="可选">
        </div>
        <div id="salesNameField" class="field-hidden">
          <label for="roleAssignSalesName">销售名字</label>
          <input id="roleAssignSalesName" placeholder="不填写则默认使用用户名">
        </div>
      </div>
      <div class="modal-actions">
        <button id="roleAssignCancel" class="subtle" type="button">取消</button>
        <button id="roleAssignSubmit" type="button">保存</button>
      </div>
    </div>
  </div>

  <script>
    const AUTH_STORAGE_KEY = 'admin-auth-v1';
    const state = {
      authToken: '',
      adminProfile: null,
      roleAssignment: null,
    };
    const $ = (id) => document.getElementById(id);

    function headers() {
      const result = { 'Content-Type': 'application/json' };
      if (state.authToken) result['x-admin-token'] = state.authToken;
      return result;
    }

    function readStoredAuth() {
      const raw = localStorage.getItem(AUTH_STORAGE_KEY);
      if (raw) return raw;
      try {
        if (window.parent && window.parent !== window && window.parent.localStorage) {
          return window.parent.localStorage.getItem(AUTH_STORAGE_KEY);
        }
      } catch (err) {
        return '';
      }
      return '';
    }

    function updateAuthUI() {
      const status = $('authStatus');
      if (state.adminProfile) {
        status.textContent = `已登录：${state.adminProfile.displayName || state.adminProfile.username} / ${state.adminProfile.roleType || 'sales'}`;
      } else {
        status.textContent = '未登录';
      }
      $('adminLogout').disabled = !state.authToken;
    }

    function clearAuth() {
      state.authToken = '';
      state.adminProfile = null;
      localStorage.removeItem(AUTH_STORAGE_KEY);
      try {
        if (window.parent && window.parent !== window && window.parent.localStorage) {
          window.parent.localStorage.removeItem(AUTH_STORAGE_KEY);
        }
      } catch (err) {
        // ignore cleanup errors
      }
      updateAuthUI();
    }

    function redirectToLogin() {
      if (window.parent && window.parent !== window) {
        window.parent.location.replace('/admin');
        return;
      }
      window.location.replace('/admin');
    }

    function showNotice(message, isError = false) {
      const notice = $('notice');
      notice.textContent = message;
      notice.className = `notice show${isError ? ' error' : ''}`;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function formatDateTime(value) {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '-';
      return date.toLocaleString('zh-CN', { hour12: false });
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, options);
      const json = await response.json().catch(() => ({}));
      if (response.status === 401) {
        clearAuth();
        redirectToLogin();
      }
      if (!response.ok || json.code !== 0) {
        throw new Error(json.message || `请求失败：${response.status}`);
      }
      return json;
    }

    function updateRoleAssignmentUI() {
      const role = document.querySelector('input[name="assignRoleType"]:checked')?.value || 'coupon-admin';
      $('salesNameField').classList.toggle('field-hidden', role !== 'sales');
    }

    function closeRoleAssignmentModal() {
      state.roleAssignment = null;
      $('roleAssignModal').classList.remove('show');
      $('roleAssignModal').setAttribute('aria-hidden', 'true');
      $('roleAssignRemark').value = '';
      $('roleAssignSalesName').value = '';
      document.querySelector('input[name="assignRoleType"][value="coupon-admin"]').checked = true;
      updateRoleAssignmentUI();
      $('roleAssignSubmit').disabled = false;
    }

    function openRoleAssignmentModal(user) {
      state.roleAssignment = user || null;
      $('roleAssignUserName').textContent = user?.nickName || '未命名用户';
      $('roleAssignUserOpenid').textContent = user?.openid || '-';
      $('roleAssignRemark').value = user?.nickName ? `用户：${user.nickName}` : '';
      $('roleAssignSalesName').value = user?.nickName || '';
      document.querySelector('input[name="assignRoleType"][value="coupon-admin"]').checked = true;
      updateRoleAssignmentUI();
      $('roleAssignModal').classList.add('show');
      $('roleAssignModal').setAttribute('aria-hidden', 'false');
      $('roleAssignSubmit').focus();
    }

    async function loadLatestUsers() {
      const button = $('refreshLatestUsers');
      button.disabled = true;
      try {
        const json = await requestJson('/api/admin/latest-users', { headers: headers() });
        const users = json.data || [];
        $('latestUsers').innerHTML = users.length ? users.map((item) => `
          <div class="mini-row">
            <div>
              <strong>${escapeHtml(item.nickName || '未命名用户')}</strong>
              <div class="small">openid：${escapeHtml(item.openid || '-')}</div>
              <div class="small">最近登录：${escapeHtml(formatDateTime(item.updatedAt))}</div>
            </div>
            <button
              class="secondary"
              type="button"
              data-action="fill-binding-role"
              data-openid="${escapeHtml(item.openid || '')}"
              data-name="${escapeHtml(item.nickName || '')}"
            >绑定</button>
          </div>
        `).join('') : '<div class="empty">暂无用户登录记录</div>';
      } finally {
        button.disabled = false;
      }
    }

    async function saveRoleAssignment() {
      const user = state.roleAssignment;
      if (!user?.openid) {
        showNotice('缺少用户信息，请重新选择', true);
        return;
      }
      const role = document.querySelector('input[name="assignRoleType"]:checked')?.value || 'coupon-admin';
      const remark = $('roleAssignRemark').value.trim();
      const submitButton = $('roleAssignSubmit');
      submitButton.disabled = true;
      try {
        if (role === 'sales') {
          const salesName = $('roleAssignSalesName').value.trim();
          await requestJson('/api/admin/sales', {
            method: 'POST',
            headers: headers(),
            body: JSON.stringify({
              openid: user.openid,
              salesName,
              remark,
            }),
          });
          showNotice('销售已保存');
        } else {
          await requestJson('/api/admin/coupon-admins', {
            method: 'POST',
            headers: headers(),
            body: JSON.stringify({
              openid: user.openid,
              remark,
            }),
          });
          showNotice('优惠券管理员已保存');
        }
        closeRoleAssignmentModal();
      } catch (err) {
        showNotice(err.message, true);
        submitButton.disabled = false;
      }
    }

    async function restoreAdminAuth() {
      const raw = readStoredAuth();
      if (!raw) {
        updateAuthUI();
        redirectToLogin();
        return;
      }
      try {
        const stored = JSON.parse(raw);
        state.authToken = String(stored?.token || '');
        state.adminProfile = stored?.account || null;
        updateAuthUI();
        const json = await requestJson('/api/admin/me', { headers: headers() });
        state.adminProfile = json.data || state.adminProfile;
        updateAuthUI();
        await loadLatestUsers();
      } catch (err) {
        clearAuth();
        redirectToLogin();
      }
    }

    $('latestUsers').addEventListener('click', (event) => {
      const target = event.target.closest('[data-action="fill-binding-role"]');
      if (!target) return;
      openRoleAssignmentModal({
        openid: target.dataset.openid || '',
        nickName: target.dataset.name || '',
      });
    });

    $('refreshLatestUsers').addEventListener('click', async () => {
      try {
        await loadLatestUsers();
        showNotice('最新登录用户已刷新');
      } catch (err) {
        showNotice(err.message, true);
      }
    });

    $('openCouponsPage').addEventListener('click', () => {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'admin:navigate', page: 'coupons' }, '*');
        return;
      }
      window.location.href = '/admin/dashboard?page=coupons';
    });

    $('roleAssignCancel').addEventListener('click', closeRoleAssignmentModal);
    $('roleAssignModal').addEventListener('click', (event) => {
      const target = event.target.closest('[data-action="close-role-assign-modal"]');
      if (!target) return;
      closeRoleAssignmentModal();
    });
    document.querySelectorAll('input[name="assignRoleType"]').forEach((input) => {
      input.addEventListener('change', updateRoleAssignmentUI);
    });
    $('roleAssignSubmit').addEventListener('click', saveRoleAssignment);
    $('adminLogout').addEventListener('click', () => {
      clearAuth();
      redirectToLogin();
    });

    restoreAdminAuth();
  </script>
</body>
</html>
