<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>订单详情</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f4f6f8;
      color: #172033;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .shell {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 20px 56px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 36px;
    }
    .muted,
    .small {
      color: #667085;
      font-size: 14px;
      line-height: 22px;
    }
    .small {
      font-size: 12px;
      line-height: 18px;
    }
    .panel {
      background: #fff;
      border: 1px solid #e4e7ec;
      border-radius: 12px;
      box-shadow: 0 8px 22px rgba(20, 35, 60, 0.05);
    }
    .toolbar,
    .section {
      padding: 18px;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .actions {
      display: flex;
      gap: 10px;
    }
    .notice {
      display: none;
      margin-bottom: 16px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #ecfdf3;
      color: #027a48;
      font-size: 14px;
      line-height: 22px;
      white-space: pre-wrap;
    }
    .notice.error {
      background: #fef3f2;
      color: #b42318;
    }
    .notice.show { display: block; }
    button {
      min-height: 40px;
      border: 0;
      border-radius: 8px;
      padding: 0 14px;
      background: #2472c8;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary {
      background: #edf4ff;
      color: #1f5f9f;
    }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
    }
    .hero-card {
      padding: 22px;
      margin-bottom: 16px;
    }
    .hero-title {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .hero-title strong {
      font-size: 24px;
      line-height: 32px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }
    .badge.pending { background: #fff4e8; color: #b54708; }
    .badge.shipped { background: #eff8ff; color: #175cd3; }
    .badge.done { background: #ecfdf3; color: #027a48; }
    .badge.returning { background: #fff6ed; color: #c4320a; }
    .badge.refunded { background: #f2f4f7; color: #344054; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .kv {
      padding: 14px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid #edf2f7;
    }
    .kv label {
      display: block;
      margin-bottom: 6px;
      color: #667085;
      font-size: 12px;
      line-height: 18px;
      font-weight: 700;
    }
    .kv div {
      word-break: break-word;
      font-size: 14px;
      line-height: 22px;
    }
    .section + .section {
      border-top: 1px solid #eef2f6;
    }
    .section h2 {
      margin: 0 0 14px;
      font-size: 18px;
      line-height: 26px;
    }
    .goods-list,
    .timeline {
      display: grid;
      gap: 12px;
    }
    .goods-item,
    .timeline-item {
      padding: 14px;
      border: 1px solid #eef2f6;
      border-radius: 10px;
      background: #fbfdff;
    }
    .goods-title {
      font-size: 15px;
      line-height: 24px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .cols-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .json-box {
      margin: 0;
      padding: 14px;
      border-radius: 10px;
      background: #0f172a;
      color: #d7e3f4;
      font-size: 12px;
      line-height: 20px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    details summary {
      cursor: pointer;
      color: #1f5f9f;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .empty {
      padding: 22px 16px;
      text-align: center;
      color: #667085;
      border: 1px dashed #d0d5dd;
      border-radius: 10px;
      background: #fcfcfd;
    }
    @media (max-width: 920px) {
      .topbar,
      .toolbar,
      .hero,
      .cols-2 {
        grid-template-columns: 1fr;
        display: grid;
      }
      .actions {
        flex-wrap: wrap;
      }
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
    @media (max-width: 560px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>订单详情</h1>
        <p id="pageDesc" class="muted">按模块查看订单、商品、物流、支付和售后信息。</p>
      </div>
      <div class="actions">
        <button id="openApiView" class="secondary" type="button">查看 JSON</button>
        <button id="reloadDetail" type="button">刷新详情</button>
      </div>
    </header>

    <div id="notice" class="notice"></div>

    <section class="panel hero-card">
      <div class="hero">
        <div>
          <div class="hero-title">
            <strong id="heroOrderNo">订单 -</strong>
            <span id="heroStatus" class="badge">-</span>
          </div>
          <div id="heroMeta" class="muted">-</div>
        </div>
      </div>
      <div id="summaryGrid" class="grid" style="margin-top:16px"></div>
    </section>

    <section class="panel">
      <div class="section">
        <h2>商品信息</h2>
        <div id="goodsList" class="goods-list"></div>
      </div>
      <div class="section">
        <h2>收件与物流</h2>
        <div id="shippingGrid" class="grid"></div>
        <div id="trajectoryList" class="timeline" style="margin-top:14px"></div>
      </div>
      <div class="section">
        <h2>支付与优惠</h2>
        <div id="paymentGrid" class="grid"></div>
      </div>
      <div class="section">
        <h2>备注与售后</h2>
        <div class="cols-2">
          <div>
            <div class="kv">
              <label>订单备注</label>
              <div id="orderRemark">-</div>
            </div>
          </div>
          <div>
            <div class="kv">
              <label>售后信息</label>
              <div id="afterSaleInfo">-</div>
            </div>
          </div>
        </div>
      </div>
      <div class="section">
        <h2>原始数据</h2>
        <details>
          <summary>展开查看原始 JSON</summary>
          <pre id="rawJson" class="json-box"></pre>
        </details>
      </div>
    </section>
  </main>

  <script>
    const AUTH_STORAGE_KEY = 'admin-auth-v1';
    const state = {
      authToken: '',
      orderNo: '',
      rawOrder: null,
    };
    const $ = (id) => document.getElementById(id);

    function showNotice(message, isError = false) {
      const notice = $('notice');
      notice.textContent = message;
      notice.className = `notice show${isError ? ' error' : ''}`;
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function money(fen) {
      return `¥${(Number(fen || 0) / 100).toFixed(2)}`;
    }

    function formatDateTime(value) {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '-';
      return date.toLocaleString('zh-CN', { hour12: false });
    }

    function readStoredAuth() {
      const raw = localStorage.getItem(AUTH_STORAGE_KEY);
      if (raw) return raw;
      try {
        if (window.opener && window.opener.localStorage) {
          return window.opener.localStorage.getItem(AUTH_STORAGE_KEY);
        }
      } catch (err) {
        return '';
      }
      return '';
    }

    function readOrderNo() {
      const parts = window.location.pathname.split('/').filter(Boolean);
      return decodeURIComponent(parts[parts.length - 1] || '').trim();
    }

    function headers() {
      const result = { 'Content-Type': 'application/json' };
      if (state.authToken) result['x-admin-token'] = state.authToken;
      return result;
    }

    function getBadgeClass(status) {
      const code = Number(status);
      if (code === 10) return 'pending';
      if (code === 40) return 'shipped';
      if (code === 50) return 'done';
      if (code === 60) return 'returning';
      if (code === 70 || code === 80) return 'refunded';
      return '';
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, options);
      const json = await response.json().catch(() => ({}));
      if (!response.ok || json.code !== 0) {
        throw new Error(json.message || `请求失败：${response.status}`);
      }
      return json;
    }

    function renderGrid(containerId, items) {
      $(containerId).innerHTML = items.map((item) => `
        <div class="kv">
          <label>${escapeHtml(item.label)}</label>
          <div>${escapeHtml(item.value)}</div>
        </div>
      `).join('');
    }

    function renderGoods(order) {
      const goods = Array.isArray(order.orderItemVOs) ? order.orderItemVOs : [];
      $('goodsList').innerHTML = goods.length ? goods.map((item) => `
        <div class="goods-item">
          <div class="goods-title">${escapeHtml(item.goodsName || '商品')}</div>
          <div class="small">SPU：${escapeHtml(item.spuId || '-')} / SKU：${escapeHtml(item.skuId || '-')}</div>
          <div class="small">规格：${escapeHtml((item.specInfo || []).map((spec) => spec.specValue).filter(Boolean).join(' / ') || '-')}</div>
          <div class="small">数量：${escapeHtml(item.buyQuantity || 1)} / 单价：${escapeHtml(money(item.actualPrice || item.tagPrice || 0))}</div>
        </div>
      `).join('') : '<div class="empty">暂无商品信息</div>';
    }

    function renderTrajectory(order) {
      const trajectoryVos = Array.isArray(order.trajectoryVos) ? order.trajectoryVos : [];
      const rows = trajectoryVos.flatMap((group) => (group.nodes || []).map((node) => ({
        title: group.title || '物流节点',
        status: node.status || '-',
        time: formatDateTime(Number(node.timestamp || 0)),
      })));
      $('trajectoryList').innerHTML = rows.length ? rows.map((item) => `
        <div class="timeline-item">
          <div><strong>${escapeHtml(item.title)}</strong></div>
          <div class="small">${escapeHtml(item.status)}</div>
          <div class="small">${escapeHtml(item.time)}</div>
        </div>
      `).join('') : '<div class="empty">暂无物流轨迹</div>';
    }

    function renderOrder(order) {
      state.rawOrder = order;
      document.title = `订单详情 - ${order.orderNo || '-'}`;
      $('heroOrderNo').textContent = `订单 ${order.orderNo || '-'}`;
      $('heroStatus').textContent = order.orderStatusName || '-';
      $('heroStatus').className = `badge ${getBadgeClass(order.orderStatus)}`;
      $('heroMeta').textContent = `下单时间：${formatDateTime(order.createTime)} / 订单ID：${order.orderId || '-'}`;

      renderGrid('summaryGrid', [
        { label: '客户实付', value: money(order.paymentAmount || order.totalAmount || 0) },
        { label: '商品金额', value: money(order.goodsAmount || order.totalAmount || 0) },
        { label: '优惠券抵扣', value: money(order.couponAmount || 0) },
        { label: '客服经理openid', value: order.salesOpenid || '-' },
      ]);

      const logistics = order.logisticsVO || {};
      renderGrid('shippingGrid', [
        { label: '收件人', value: [logistics.receiverName, logistics.receiverPhone].filter(Boolean).join(' ') || '-' },
        { label: '收货地址', value: [
          logistics.receiverProvince,
          logistics.receiverCity,
          logistics.receiverCountry,
          logistics.receiverArea,
          logistics.receiverAddress,
        ].filter(Boolean).join(' ') || '-' },
        { label: '物流公司', value: logistics.logisticsCompanyName || '-' },
        { label: '物流单号', value: logistics.logisticsNo || '-' },
      ]);

      const payment = order.paymentVO || {};
      const coupon = order.couponSnapshot || {};
      renderGrid('paymentGrid', [
        { label: '支付状态', value: Number(payment.payStatus) === 1 ? '已支付' : '未支付' },
        { label: '支付时间', value: formatDateTime(payment.paySuccessTime || payment.payTime) },
        { label: '微信交易单号', value: payment.transactionId || payment.channelTrxNo || payment.traceNo || '-' },
        { label: '优惠券', value: coupon.title ? `${coupon.title} / ${coupon.couponNo || order.couponNo || '-'}` : (order.couponNo || '-') },
      ]);

      renderGoods(order);
      renderTrajectory(order);
      $('orderRemark').textContent = order.remark || '-';
      $('afterSaleInfo').textContent = order.rightsNo ? `${order.rightsNo} / ${order.orderStatusName || '-'}` : '暂无售后信息';
      $('rawJson').textContent = JSON.stringify(order, null, 2);
    }

    async function loadOrder() {
      try {
        const raw = readStoredAuth();
        const fromQuery = new URLSearchParams(window.location.search).get('token') || '';
        if (fromQuery) {
          state.authToken = fromQuery;
        } else if (raw) {
          const stored = JSON.parse(raw);
          state.authToken = String(stored?.token || '');
        }
        state.orderNo = readOrderNo();
        if (!state.orderNo) throw new Error('缺少订单号');
        const json = await requestJson(`/api/admin/order/${encodeURIComponent(state.orderNo)}`, { headers: headers() });
        renderOrder(json.data || {});
      } catch (err) {
        showNotice(err.message || '订单详情加载失败', true);
      }
    }

    $('reloadDetail').addEventListener('click', loadOrder);
    $('openApiView').addEventListener('click', () => {
      const token = state.authToken ? `?token=${encodeURIComponent(state.authToken)}` : '';
      window.open(`/api/admin/order/${encodeURIComponent(state.orderNo)}${token}`, '_blank');
    });

    loadOrder();
  </script>
</body>
</html>
