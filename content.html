<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>内容页 / 报告推送</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #eef2f6; color: #172033; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .page { max-width: 1080px; margin: 0 auto; display: grid; gap: 18px; }
    .card { padding: 20px 22px; border-radius: 16px; background: #fff; box-shadow: 0 12px 28px rgba(16, 24, 40, .08); }
    h1 { margin: 0; font-size: 24px; } .muted, .small { color: #667085; font-size: 14px; line-height: 22px; } .small { font-size: 12px; line-height: 18px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #344054; margin-bottom: 6px; }
    label .req { color: #b42318; }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #d0d5dd; border-radius: 10px; font: inherit; font-size: 14px; color: #172033; background: #fff; }
    textarea { resize: vertical; min-height: 64px; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #1b3558; box-shadow: 0 0 0 3px rgba(27, 53, 88, .1); }
    .section-title { margin: 4px 0 14px; font-size: 16px; font-weight: 700; }
    .divider { height: 1px; background: #e4e7ec; margin: 18px 0; }
    button { font: inherit; height: 40px; padding: 0 16px; border: 0; border-radius: 10px; background: #1b3558; color: #fff; font-weight: 700; cursor: pointer; }
    button.subtle { background: #e7eef8; color: #17314d; } button.danger { background: #fef3f2; color: #b42318; } button:disabled { opacity: .55; cursor: not-allowed; }
    .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .notice { min-height: 22px; color: #175cd3; font-size: 14px; white-space: pre-wrap; } .notice.error { color: #b42318; }
    .block-row { padding: 14px; border: 1px solid #e4e7ec; border-radius: 12px; margin-bottom: 12px; background: #fafbfc; }
    .block-row .block-head { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
    .block-row .block-head select { width: 130px; } .block-row .block-head input.b-title { flex: 1; min-width: 160px; }
    .block-row .block-head button { height: 34px; padding: 0 12px; }
    .block-row .row-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .media-field { display: flex; gap: 8px; align-items: center; }
    .media-field input.b-media { flex: 1; min-width: 0; }
    .media-field .b-upload { height: 40px; padding: 0 14px; flex: none; }
    .upload-result-input { flex: 1; min-width: 0; }
    .subscriber-list { display: grid; gap: 6px; max-height: 340px; overflow: auto; }
    .subscriber-row { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid #e4e7ec; border-radius: 10px; background: #fafbfc; cursor: pointer; }
    .subscriber-row:hover { border-color: #1b3558; }
    .subscriber-row .sub-check { width: auto; flex: none; }
    .subscriber-row .sub-name { font-weight: 600; min-width: 100px; }
    .subscriber-row .sub-phone { color: #667085; min-width: 110px; }
    .subscriber-row .sub-time { color: #98a2b3; font-size: 12px; margin-left: auto; }
    .subscriber-row .sub-fill { flex: none; height: 30px; padding: 0 10px; }
    .empty { padding: 28px; text-align: center; color: #667085; }
    @media (max-width: 720px) { body { padding: 16px; } .grid-2, .grid-3, .block-row .row-fields { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="card"><h1>内容页 / 报告推送</h1><div class="muted">填写报告内容与推送信息，保存后向目标用户发送「检测报告通知」订阅消息；也可只填推送信息单独触发推送。</div></section>

    <section class="card">
      <div class="section-title">基本信息</div>
      <div class="grid-2">
        <div><label>报告标识（pageKey）<span class="req">*</span></label><input id="pageKey" placeholder="如 report-20261024-001（字母开头，字母/数字/_-）"></div>
        <div><label>报告标题</label><input id="title" placeholder="如 肠道微生态检测报告"></div>
      </div>
      <div class="grid-2" style="margin-top:14px;">
        <div><label>目标用户 openid <span class="req">*</span></label><input id="openid" list="customerList" placeholder="从客户列表选择，或手动粘贴 openid"><datalist id="customerList"></datalist></div>
        <div><label>关联订单号</label><input id="orderNo" placeholder="可选"></div>
      </div>
    </section>

    <section class="card">
      <div class="section-title">已订阅推送用户（<span id="subscriberCount">0</span>）</div>
      <div class="muted">以下用户已授权接收「检测报告通知」订阅消息。点「选择」填入目标用户（单个推送），或勾选多个后批量推送。</div>
      <div class="toolbar" style="margin-top:12px;">
        <label class="small" style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" id="selectAllSubs" style="width:auto;"> 全选</label>
        <button id="pushSelected" class="subtle" type="button">批量推送所选</button>
      </div>
      <div id="subscriberList" class="subscriber-list" style="margin-top:12px;"></div>
    </section>

    <section class="card">
      <div class="section-title">推送内容（检测报告通知模板）</div>
      <div class="grid-3">
        <div><label>报告名称</label><input id="reportName" placeholder="thing16"></div>
        <div><label>检测编号</label><input id="checkNo" placeholder="character_string8"></div>
        <div><label>受检人</label><input id="subjectName" placeholder="thing9"></div>
      </div>
      <div class="grid-2" style="margin-top:14px;">
        <div><label>温馨提示</label><input id="tip" placeholder="thing11"></div>
        <div><label>生成时间（留空则用当前时间）</label><input id="generateTime" placeholder="如 2026年10月24日 12:00"></div>
      </div>
    </section>

    <section class="card">
      <div class="section-title">内容块（文本 / 图片 / 视频 / PDF）</div>
      <div id="blocksWrap"></div>
      <div class="toolbar"><button id="addBlock" class="subtle" type="button">+ 添加内容块</button></div>
    </section>

    <section class="card">
      <div class="section-title">媒体文件上传（图片 / 视频 / PDF）</div>
      <div class="muted">上传到云存储 contentMedia/ 目录，返回相对路径，可填入上方内容块的「媒体地址」；也可直接点内容块里的「上传」按钮自动填充。</div>
      <div class="toolbar" style="margin-top:12px;">
        <input id="standaloneFile" type="file" accept="image/*,video/*,.pdf" style="flex:1;min-width:220px;">
        <button id="standaloneUpload" class="subtle" type="button">上传</button>
      </div>
      <div id="uploadResultWrap" style="margin-top:12px;display:none;">
        <label>媒体地址（复制后填入内容块的「媒体地址」）</label>
        <div class="toolbar">
          <input id="uploadResult" readonly class="upload-result-input" onclick="this.select()">
          <button id="copyResult" class="subtle" type="button">复制</button>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="toolbar">
        <button id="loadBtn" class="subtle" type="button">加载已有配置</button>
        <button id="savePushBtn" type="button">保存并推送</button>
        <button id="pushOnlyBtn" class="subtle" type="button">仅推送（不保存内容）</button>
      </div>
      <div id="notice" class="notice" aria-live="polite" style="margin-top:12px;"></div>
    </section>
  </main>

  <script>
    const AUTH_STORAGE_KEY = 'admin-auth-v1';
    const $ = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));
    const state = { token: '', customers: [], subscribers: [], blockSeq: 0 };

    function headers() { return { 'Content-Type': 'application/json', ...(state.token ? { 'x-admin-token': state.token } : {}) }; }
    function readAuth() { try { return JSON.parse(localStorage.getItem(AUTH_STORAGE_KEY) || '{}').token || ''; } catch (_) { return ''; } }
    function notice(message = '', error = false) { const el = $('notice'); el.textContent = message; el.classList.toggle('error', error); }
    function formatDate(value) { if (!value) return ''; const d = new Date(value); if (Number.isNaN(d.getTime())) return ''; const pad = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
    async function requestJson(url, options = {}) { const response = await fetch(url, options); const json = await response.json().catch(() => ({})); if (response.status === 401) { window.top.location.replace('/admin'); throw new Error('登录已过期'); } if (!response.ok || json.code !== 0) throw new Error(json.message || `请求失败：${response.status}`); return json; }

    function acceptForType(type) {
      if (type === 'image') return 'image/*';
      if (type === 'video') return 'video/*';
      if (type === 'pdf') return '.pdf,application/pdf';
      return '*/*';
    }

    async function uploadFile(file) {
      const buffer = await file.arrayBuffer();
      const response = await fetch(`/api/content/upload?filename=${encodeURIComponent(file.name)}`, {
        method: 'POST',
        headers: {
          'Content-Type': file.type || 'application/octet-stream',
          ...(state.token ? { 'x-admin-token': state.token } : {}),
        },
        body: buffer,
      });
      const json = await response.json().catch(() => ({}));
      if (response.status === 401) { window.top.location.replace('/admin'); throw new Error('登录已过期'); }
      if (!response.ok || json.code !== 0) throw new Error(json.message || `上传失败：${response.status}`);
      return json.data;
    }

    function blockRow(block) {
      const index = ++state.blockSeq;
      const type = block?.blockType || 'text';
      const div = document.createElement('div');
      div.className = 'block-row';
      div.dataset.index = String(index);
      div.innerHTML = `
        <div class="block-head">
          <span class="small" style="width:52px;">块 ${index}</span>
          <select class="b-type">
            <option value="text" ${type === 'text' ? 'selected' : ''}>文本</option>
            <option value="image" ${type === 'image' ? 'selected' : ''}>图片</option>
            <option value="video" ${type === 'video' ? 'selected' : ''}>视频</option>
            <option value="pdf" ${type === 'pdf' ? 'selected' : ''}>PDF</option>
          </select>
          <input class="b-title" placeholder="标题" value="${escapeHtml(block?.title || '')}">
          <button class="danger" type="button" data-action="remove">删除</button>
        </div>
        <div class="row-fields">
          <textarea class="b-content" placeholder="文本正文 / 说明文字">${escapeHtml(block?.content || '')}</textarea>
          <div class="media-field">
            <input class="b-media" placeholder="媒体地址（上传后自动填充，或手动粘贴文件名/地址）" value="${escapeHtml(block?.mediaUrl || '')}">
            <button class="b-upload subtle" type="button">上传</button>
            <input class="b-media-file" type="file" hidden>
          </div>
        </div>`;
      div.querySelector('[data-action="remove"]').addEventListener('click', () => div.remove());
      div.querySelector('.b-upload').addEventListener('click', () => {
        const fileInput = div.querySelector('.b-media-file');
        fileInput.accept = acceptForType(div.querySelector('.b-type').value);
        fileInput.value = '';
        fileInput.click();
      });
      div.querySelector('.b-media-file').addEventListener('change', async () => {
        const file = div.querySelector('.b-media-file').files[0];
        if (!file) return;
        const btn = div.querySelector('.b-upload');
        const original = btn.textContent;
        btn.disabled = true; btn.textContent = '上传中…';
        try {
          const data = await uploadFile(file);
          div.querySelector('.b-media').value = data.mediaUrl || '';
          notice(`✅ 已上传：${data.mediaUrl}`);
        } catch (err) {
          notice(`上传失败：${err.message}`, true);
        } finally {
          btn.disabled = false; btn.textContent = original;
        }
      });
      return div;
    }

    function collectBlocks() {
      const rows = Array.from(document.querySelectorAll('.block-row'));
      return rows.map((row, index) => ({
        blockType: row.querySelector('.b-type').value,
        title: row.querySelector('.b-title').value.trim(),
        content: row.querySelector('.b-content').value.trim(),
        mediaUrl: row.querySelector('.b-media').value.trim(),
        sort: index,
      }));
    }

    function collectPush() {
      return {
        reportName: $('reportName').value.trim(),
        checkNo: $('checkNo').value.trim(),
        subjectName: $('subjectName').value.trim(),
        tip: $('tip').value.trim(),
        generateTime: $('generateTime').value.trim(),
      };
    }

    function fillBlocks(blocks) {
      $('blocksWrap').innerHTML = '';
      state.blockSeq = 0;
      if (!blocks || !blocks.length) { $('blocksWrap').innerHTML = '<div class="empty">暂无内容块，点下方「添加内容块」</div>'; return; }
      blocks.forEach((block) => $('blocksWrap').appendChild(blockRow(block)));
    }

    async function loadCustomers() {
      try {
        const json = await requestJson('/api/admin/customers', { headers: headers() });
        state.customers = json.data || [];
        $('customerList').innerHTML = state.customers.map((c) => `<option value="${escapeHtml(c.openid)}">${escapeHtml(c.customerRemarkName || c.nickName || '未命名客户')}（${escapeHtml(c.phoneNumber || '')}）</option>`).join('');
      } catch (err) { console.warn('加载客户列表失败:', err.message); }
    }

    function selectedSubscriberOpenids() {
      return Array.from(document.querySelectorAll('.sub-check:checked')).map((el) => el.dataset.openid).filter(Boolean);
    }

    function renderSubscribers(list) {
      $('subscriberCount').textContent = String(list.length);
      const wrap = $('subscriberList');
      if (!list || !list.length) { wrap.innerHTML = '<div class="empty">暂无已订阅用户</div>'; return; }
      wrap.innerHTML = list.map((s) => `
        <div class="subscriber-row">
          <input type="checkbox" class="sub-check" style="width:auto;" data-openid="${escapeHtml(s.openid)}">
          <span class="sub-name">${escapeHtml(s.customerRemarkName || s.nickName || '未命名用户')}</span>
          <span class="sub-phone">${escapeHtml(s.phoneNumber || '')}</span>
          <span class="sub-time">${escapeHtml(formatDate(s.subscribedAt))}</span>
          <button type="button" class="sub-fill subtle">选择</button>
        </div>`).join('');
      wrap.querySelectorAll('.subscriber-row').forEach((row) => {
        row.addEventListener('click', (e) => {
          if (e.target.matches('.sub-check, button')) return;
          const box = row.querySelector('.sub-check');
          box.checked = !box.checked;
        });
        row.querySelector('.sub-fill').addEventListener('click', () => {
          const openid = row.querySelector('.sub-check').dataset.openid;
          $('openid').value = openid;
          notice('✅ 已选中该用户作为目标用户（可在下方「保存并推送」）');
        });
      });
    }

    async function loadSubscribers() {
      try {
        const json = await requestJson('/api/admin/subscribers', { headers: headers() });
        state.subscribers = json.data || [];
        renderSubscribers(state.subscribers);
      } catch (err) {
        $('subscriberCount').textContent = '加载失败';
        notice(`加载已订阅用户失败：${err.message}`, true);
      }
    }

    async function loadPage() {
      const pageKey = $('pageKey').value.trim();
      if (!pageKey) return notice('请先填写报告标识 pageKey', true);
      notice('加载中…');
      const json = await requestJson(`/api/content/page/${encodeURIComponent(pageKey)}`, { headers: headers() });
      const { page, blocks } = json.data || {};
      $('title').value = page?.title || '';
      $('openid').value = page?.openid || '';
      $('orderNo').value = page?.orderNo || '';
      const push = page?.pushData || {};
      $('reportName').value = push.reportName || '';
      $('checkNo').value = push.checkNo || '';
      $('subjectName').value = push.subjectName || '';
      $('tip').value = push.tip || '';
      $('generateTime').value = push.generateTime || '';
      fillBlocks(blocks || []);
      notice('已加载，修改后可重新保存推送');
    }

    async function saveAndPush() {
      const pageKey = $('pageKey').value.trim();
      const openid = $('openid').value.trim();
      if (!pageKey) return notice('请填写报告标识 pageKey', true);
      if (!/^[a-zA-Z][a-zA-Z0-9_-]{1,63}$/.test(pageKey)) return notice('pageKey 需字母开头，仅含字母/数字/_-', true);
      if (!openid) return notice('请填写目标用户 openid', true);
      const blocks = collectBlocks();
      if (!blocks.length) return notice('请至少添加一个内容块', true);

      const btn = $('savePushBtn'); btn.disabled = true;
      try {
        notice('正在保存并推送…');
        const json = await requestJson(`/api/content/page/${encodeURIComponent(pageKey)}`, {
          method: 'POST', headers: headers(),
          body: JSON.stringify({ title: $('title').value.trim(), openid, orderNo: $('orderNo').value.trim(), push: collectPush(), blocks }),
        });
        const push = json.data?.push;
        const pushOk = push && Number(push.errcode || 0) === 0;
        notice(`✅ 内容已保存。${pushOk ? '订阅消息推送成功' : `推送：${push?.errmsg || push?.errcode || '未触发'}`}`, !pushOk);
      } catch (err) { notice(`保存失败：${err.message}`, true); } finally { btn.disabled = false; }
    }

    async function pushOnly() {
      const selected = selectedSubscriberOpenids();
      const targets = selected.length ? selected : [$('openid').value.trim()].filter(Boolean);
      if (!targets.length) return notice('请先勾选已订阅用户，或填写目标用户 openid', true);
      const btn = $('pushOnlyBtn'); btn.disabled = true;
      try {
        notice(`正在推送 ${targets.length} 人…`);
        const json = await requestJson('/api/subscribe/send', {
          method: 'POST', headers: headers(),
          body: JSON.stringify({ openids: targets, pageKey: $('pageKey').value.trim(), push: collectPush() }),
        });
        const { results = [], okCount = 0, total = 0 } = json.data || {};
        const failed = results.filter((r) => Number(r.errcode || 0) !== 0);
        if (failed.length) {
          notice(`⚠️ ${json.message || `成功 ${okCount}/${total} 人`}；失败：${failed.map((r) => `${r.openid}（${r.errmsg || r.errcode}）`).join('；')}`, true);
        } else {
          notice(`✅ ${json.message || `推送成功 ${total} 人`}`);
        }
      } catch (err) { notice(`推送失败：${err.message}`, true); } finally { btn.disabled = false; }
    }

    function pushSelected() {
      const selected = selectedSubscriberOpenids();
      if (!selected.length) return notice('请先勾选要推送的用户', true);
      pushOnly();
    }

    $('addBlock').addEventListener('click', () => { const empty = $('blocksWrap').querySelector('.empty'); if (empty) empty.remove(); $('blocksWrap').appendChild(blockRow()); });
    $('loadBtn').addEventListener('click', () => loadPage().catch((err) => notice(err.message, true)));
    $('savePushBtn').addEventListener('click', saveAndPush);
    $('pushOnlyBtn').addEventListener('click', pushOnly);
    $('pushSelected').addEventListener('click', pushSelected);
    $('selectAllSubs').addEventListener('change', () => {
      const checked = $('selectAllSubs').checked;
      document.querySelectorAll('.sub-check').forEach((box) => { box.checked = checked; });
    });

    $('standaloneUpload').addEventListener('click', async () => {
      const input = $('standaloneFile');
      const file = input.files[0];
      if (!file) return notice('请先选择要上传的文件', true);
      const btn = $('standaloneUpload');
      const original = btn.textContent;
      btn.disabled = true; btn.textContent = '上传中…';
      try {
        notice('上传中…');
        const data = await uploadFile(file);
        $('uploadResult').value = data.mediaUrl || '';
        $('uploadResultWrap').style.display = 'block';
        notice(`✅ 已上传：${data.mediaUrl}`);
      } catch (err) {
        notice(`上传失败：${err.message}`, true);
      } finally {
        btn.disabled = false; btn.textContent = original;
      }
    });

    $('copyResult').addEventListener('click', async () => {
      const value = $('uploadResult').value;
      if (!value) return;
      try {
        await navigator.clipboard.writeText(value);
        notice('✅ 已复制到剪贴板');
      } catch (_) {
        $('uploadResult').select();
        notice('已选中，请手动复制（Ctrl/Cmd+C）');
      }
    });

    state.token = readAuth();
    if (!state.token) { window.top.location.replace('/admin'); } else { loadCustomers(); loadSubscribers(); fillBlocks([]); }
  </script>
</body>
</html>
