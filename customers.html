<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>客户管理</title><style>body{margin:0;background:#f6f8fb;font:14px Arial;color:#1f2937}.page{padding:22px}.panel{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px}.toolbar{display:flex;gap:10px;margin-bottom:14px}input,button{padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;background:#fff}button{cursor:pointer;color:#1d4ed8}.notice{margin:10px 0;color:#166534}.notice.error{color:#b91c1c}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}th button{border:0;padding:0;font-weight:bold;color:#374151}.wrap{overflow:auto}.small{color:#6b7280;font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:12px;color:#047857}</style></head><body><main class="page"><section class="panel"><h2>客户管理</h2><div class="small">所有已登录小程序的用户。点击表头可排序。</div><div class="toolbar"><input id="keyword" placeholder="搜索备注、微信名、电话、openid"><button id="refresh">刷新</button></div><div id="notice" class="notice"></div><div class="wrap"><table><thead><tr><th><button data-sort="customerRemarkName">客户备注名</button></th><th><button data-sort="nickName">微信名</button></th><th><button data-sort="phoneNumber">电话</button></th><th><button data-sort="salesName">归属上家渠道销售</button></th><th>操作</th></tr></thead><tbody id="body"></tbody></table></div></section></main><script>
const state={token:'',items:[],sort:'customerRemarkName',asc:true};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');
function headers(){return{'Content-Type':'application/json','x-admin-token':state.token}}function notice(m,e=false){$('notice').textContent=m;$('notice').className='notice'+(e?' error':'')}async function req(url,opt={}){const r=await fetch(url,opt),j=await r.json();if(!r.ok||j.code!==0)throw Error(j.message||'请求失败');return j}
function render(){const k=$('keyword').value.trim().toLowerCase();const items=state.items.filter(x=>[x.customerRemarkName,x.nickName,x.phoneNumber,x.salesName,x.openid].join(' ').toLowerCase().includes(k)).sort((a,b)=>String(a[state.sort]||'').localeCompare(String(b[state.sort]||''),'zh-CN')*(state.asc?1:-1));$('body').innerHTML=items.length?items.map(x=>`<tr><td>${esc(x.customerRemarkName||'-')}</td><td>${esc(x.nickName||'-')}<div class="small">${esc(x.openid)}</div></td><td>${esc(x.phoneNumber||'-')}</td><td>${esc(x.salesName||'-')}<div class="small">${esc(x.salesOpenid||'')}</div></td><td><div class="actions"><button data-a="remark" data-o="${esc(x.openid)}" data-v="${esc(x.customerRemarkName)}">修改备注名</button><button data-a="channel" data-o="${esc(x.openid)}">修改渠道归属</button><button data-a="sales" data-o="${esc(x.openid)}" data-n="${esc(x.nickName)}">${x.isSales?'已绑定销售':'绑定为销售'}</button><button data-a="admin" data-o="${esc(x.openid)}">${x.isCouponAdmin?'已是优惠券管理员':'绑定为优惠券管理员'}</button></div></td></tr>`).join(''):'<tr><td colspan="5">暂无客户</td></tr>'}
async function load(){try{state.items=(await req('/api/admin/customers',{headers:headers()})).data||[];render();notice(`已加载 ${state.items.length} 位客户`)}catch(e){notice(e.message,true)}}
async function action(t){const o=t.dataset.o,a=t.dataset.a;if(a==='remark'){const adminRemarkName=prompt('客户备注名（留空清除）',t.dataset.v||'');if(adminRemarkName===null)return;await req(`/api/admin/customers/${encodeURIComponent(o)}/remark-name`,{method:'POST',headers:headers(),body:JSON.stringify({adminRemarkName})})}if(a==='channel'){const sales=(await req('/api/admin/sales',{headers:headers()})).data||[];const text=sales.map((x,i)=>`${i+1}. ${x.remarkName||x.salesName||x.openid}`).join('\n');const index=Number(prompt(`输入目标销售序号：\n${text}`,''));if(!index)return;const target=sales[index-1];if(!target)return notice('销售序号无效',true);await req('/api/admin/sales/bindings/reassign',{method:'POST',headers:headers(),body:JSON.stringify({userOpenid:o,salesOpenid:target.openid})})}if(a==='sales'&&!t.textContent.includes('已绑定')){const salesName=prompt('销售名称',t.dataset.n||'');if(salesName===null)return;await req('/api/admin/sales',{method:'POST',headers:headers(),body:JSON.stringify({openid:o,salesName})})}if(a==='admin'&&!t.textContent.includes('已是'))await req('/api/admin/coupon-admins',{method:'POST',headers:headers(),body:JSON.stringify({openid:o,remark:'客户管理绑定'})});await load()}
document.querySelectorAll('[data-sort]').forEach(b=>b.onclick=()=>{state.asc=state.sort===b.dataset.sort?!state.asc:true;state.sort=b.dataset.sort;render()});$('refresh').onclick=load;$('keyword').oninput=render;$('body').onclick=e=>{const t=e.target.closest('[data-a]');if(t)action(t).catch(x=>notice(x.message,true))};const raw=localStorage.getItem('admin-auth-v1')||(window.parent&&window.parent.localStorage.getItem('admin-auth-v1'));try{state.token=JSON.parse(raw||'{}').token||''}catch(e){}load();
</script></body></html>
